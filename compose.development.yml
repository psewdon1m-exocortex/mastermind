name: mastermind-development
services:
  initialize:
    image: python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
    user: "0:0"
    network_mode: none
    volumes:
      - core-data:/data
      - vault-data:/vault
      - runtime-data:/runtime
      - work-data:/work
    command:
      - python
      - -c
      - "import os; [(os.makedirs(p,exist_ok=True),os.chown(p,10001,10001),os.chmod(p,0o700)) for p in ['/data','/vault','/runtime','/work']]"
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  runtime:
    init: true
    image: mastermind-runtime:development
    build: {context: ., dockerfile: Dockerfile.runtime}
    depends_on:
      initialize: {condition: service_completed_successfully}
    user: "10001:10001"
    read_only: true
    environment:
      MASTERMIND_CORE_URL: http://core:18390
      MASTERMIND_SECRET_DIRECTORY: /run/mastermind
    volumes:
      - vault-data:/vault
      - runtime-data:/home/mastermind
      - ./.local/secrets/runtime:/run/mastermind:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m,mode=1777"]
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 2
    pids_limit: 256
    networks: [private]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz',timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  core:
    image: mastermind-core:development
    build: {context: ., dockerfile: Dockerfile}
    depends_on:
      runtime: {condition: service_healthy}
      worker: {condition: service_healthy}
    user: "10001:10001"
    read_only: true
    environment:
      MASTERMIND_HOME: /data
      MASTERMIND_PUBLIC_URL: http://localhost:18390
      MASTERMIND_SECRET_BACKEND: development-files
      MASTERMIND_RUNTIME_URL: http://runtime:8091
      MASTERMIND_WORKER_URL: http://worker:8092
      MASTERMIND_SECRET_DIRECTORY: /run/mastermind
    ports: ["127.0.0.1:18390:18390"]
    volumes:
      - core-data:/data
      - vault-data:/data/vault
      - ./.local/secrets/core:/run/mastermind:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    networks: [private, edge]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18390/healthz',timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  worker:
    init: true
    image: mastermind-worker:development
    build:
      context: .
      dockerfile: Dockerfile.worker
      additional_contexts:
        embedding: ./.local/models/multilingual-e5-small
    depends_on:
      initialize: {condition: service_completed_successfully}
    user: "10001:10001"
    read_only: true
    volumes:
      - work-data:/work
      - ./.local/secrets/worker:/run/mastermind:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    networks: [private, worker-egress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request,pathlib,json; r=urllib.request.Request('http://127.0.0.1:8092/healthz',headers={'Authorization':'Bearer '+pathlib.Path('/run/mastermind/worker_token').read_text()}); assert json.load(urllib.request.urlopen(r,timeout=3))['ready']"]
      interval: 10s
      timeout: 4s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
networks:
  private: {internal: true}
  edge: {}
  worker-egress: {}
volumes:
  core-data:
  vault-data:
  runtime-data:
  work-data:
