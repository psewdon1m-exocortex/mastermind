# Include once in the host nginx http {} context. All names are service-owned.
map $http_upgrade $mastermind_upgrade {
    default upgrade;
    '' close;
}
map $uri $mastermind_log_route {
    ~^/s/ /s/[redacted];
    ~^/api/v1/crusher/jobs/ /api/v1/crusher/jobs/[id];
    ~^/api/v1/crusher/uploads/ /api/v1/crusher/uploads/[id];
    default $uri;
}
log_format mastermind_safe '$time_iso8601 $remote_addr $request_method $mastermind_log_route '
                            '$status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=mastermind_login:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=mastermind_connections:1m;
